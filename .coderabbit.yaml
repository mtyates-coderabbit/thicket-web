# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US

reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false

  path_filters:
    - "!**/package-lock.json"
    - "!dist/**"

  path_instructions:
    - path: "src/graphql/**/*.graphql"
      instructions: |
        These operations and fragments are validated against the thicket-api schema
        (schema/schema.graphql in mtyates-coderabbit/thicket-api). Verify that every selected
        field, argument, and enum value exists on thicket-api's main branch. If a selection
        depends on a field that only exists in an open thicket-api pull request, say so and
        name the dependency. Prefer non-deprecated fields.

    - path: "src/gql/**"
      instructions: |
        Generated by graphql-codegen from schema/thicket-api.graphql and src/graphql/**. Do not
        review style. Only check that it is consistent with the .graphql changes in this PR
        (i.e. codegen was re-run).

    - path: "schema/thicket-api.graphql"
      instructions: |
        Vendored copy of the API schema, updated with `npm run schema:pull`. It must match
        schema/schema.graphql on thicket-api main. Flag hand edits.

    - path: "src/lib/**/*.ts"
      instructions: |
        Helpers here interpret API values. money.ts assumes amounts are USD dollars.
        orderStatus.ts handles OrderStatus exhaustively. payment.ts assumes a payment is
        present. Check that changes stay consistent with the API's documented units,
        nullability, and enum values.

    - path: "src/components/**/*.tsx"
      instructions: |
        Components render API data. Check handling of loading, error, null, and empty states,
        and that nullable fields from generated types are guarded before use.

  pre_merge_checks:
    title:
      mode: warning
      requirements: "Imperative mood, under 72 characters, describing the user-visible change."
    description:
      mode: warning
    custom_checks:
      - name: "Operations match the API schema"
        mode: error
        instructions: |
          Scope: src/graphql/**/*.graphql.

          Evidence: schema/schema.graphql on the main branch of the linked repository
          mtyates-coderabbit/thicket-api.

          Fail if a new or changed operation or fragment selects a field, passes an argument, or
          references an enum value or input field that does not exist on thicket-api main. Cite
          the operation and the missing element. If the element exists only in an open
          thicket-api pull request, say the PR must merge and deploy first.

          Fail if a required argument or required input field defined in the API schema is not
          supplied by a changed operation.

          Return Inconclusive if the thicket-api schema could not be read. Pass otherwise.

      - name: "Generated types are current"
        mode: error
        instructions: |
          Fail if files under src/graphql/** or schema/thicket-api.graphql changed but
          src/gql/graphql.ts did not, or if src/gql/graphql.ts changed without a matching
          .graphql or schema change. Pass otherwise.

      - name: "Forward-compatible API handling"
        mode: warning
        instructions: |
          Scope: src/lib/** and src/components/**.

          Fail if changed code introduces any of the following without a safe fallback:
          1. Handling of an API enum that throws or renders nothing for an unrecognized value.
          2. Reading a nullable field from generated types without a null check.
          3. Arithmetic or formatting on an API amount that assumes a unit other than USD
             dollars.
          Pass otherwise.

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - "thicket-api:docs/schema-guidelines.md"
  linked_repositories:
    - repository: "mtyates-coderabbit/thicket-api"
      instructions: |
        GraphQL API this app consumes. schema/schema.graphql is the contract; resolvers live in
        src/resolvers/ and pricing/checkout/refund logic in src/domain/. Money fields are USD
        decimal amounts. docs/schema-guidelines.md describes how the schema evolves (deprecate
        before removal, optional new arguments, coordinated enum additions).

chat:
  auto_reply: true
